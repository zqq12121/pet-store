# 买家和后台共用入口；API 与 SSE 转到容器网关。
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 101m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        # 使用 Docker DNS 动态解析，网关重建后无需重启 Nginx。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway http://gateway-server:8080;
        proxy_pass $gateway$request_uri;
        proxy_set_header Host $http_host;
        # 本机入口不信任浏览器自带的代理头，避免伪造来源绕过登录限流。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
        # 私有文件链接可能含短期访问令牌，不写入访问日志。
        access_log off;
    }
    location = /admin { return 302 /admin/; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
