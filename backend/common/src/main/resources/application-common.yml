# 两个业务服务共享原 MySQL 和 Redis；禁止启动时自动建表或覆盖现有数据。
spring:
  datasource:
    url: ${PAW_DB_URL:jdbc:mysql://127.0.0.1:3306/warmpaw?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${PAW_DB_USERNAME:warmpaw}
    password: ${PAW_DB_PASSWORD:}
  sql:
    init:
      mode: never
  # 迁移版本管理。V1–V7 是历史上手工执行过的增量脚本（已归档到 db/migration），
  # 新建库由 compose 挂载的 schema.sql 一次建全，两边都已经是最新结构，
  # 所以用 baseline-version=7 把它们标记为"已应用"而不重复执行。
  # 今后新增结构变更时，放一个 V8__xxx.sql 即可自动执行且只执行一次。
  flyway:
    enabled: ${PAW_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 7
    # 已有库的表结构可能与脚本结果存在细微差异（历史上是手工执行的），
    # 不让校验失败阻断启动；新迁移仍然严格按版本执行。
    validate-on-migrate: false
  data:
    redis:
      host: ${PAW_REDIS_HOST:127.0.0.1}
      port: ${PAW_REDIS_PORT:6380}
      password: ${PAW_REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: ${NACOS_GROUP:WARMPAW}
        ip: ${SERVICE_IP:127.0.0.1}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
app:
  storage: ${PAW_STORAGE:./data/files}
  admin-username: ${PAW_ADMIN_USERNAME:admin}
  admin-password: ${PAW_ADMIN_PASSWORD:}
  mock-providers: ${PAW_MOCK_PROVIDERS:false}
  redis-enabled: true
  # 买家登录 Cookie 是否加 Secure；只有全站 HTTPS 时才能打开（compose.production.yaml 已设为 true）。
  auth-cookie-secure: ${PAW_AUTH_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        # prometheus 端点供 Prometheus 抓取 JVM/HTTP/连接池指标；health、info 保持原有用途。
        # 暴露范围仅限本机或内网，公网部署时应在 Nginx 层拒绝 /actuator 前缀。
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
---
spring:
  config:
    activate:
      on-profile: local
app:
  mock-providers: ${PAW_MOCK_PROVIDERS:true}
