# 生产部署前由 DBA 在独立库执行 schema.sql，禁止启动时隐式修改生产表。
spring:
  datasource:
    url: ${PAW_DB_URL}
    username: ${PAW_DB_USERNAME}
    password: ${PAW_DB_PASSWORD}
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${PAW_REDIS_HOST:127.0.0.1}
      port: ${PAW_REDIS_PORT:6379}
      password: ${PAW_REDIS_PASSWORD:}
app:
  mock-providers: false
  redis-enabled: true
