# 与 local 一起启用：真实 MySQL/Redis，短信和付款仍为本地模拟。
spring:
  datasource:
    url: ${PAW_DB_URL:jdbc:mysql://127.0.0.1:3306/warmpaw?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${PAW_DB_USERNAME:warmpaw}
    password: ${PAW_DB_PASSWORD}
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${PAW_REDIS_HOST:127.0.0.1}
      port: ${PAW_REDIS_PORT:6380}
      password: ${PAW_REDIS_PASSWORD:}
app:
  redis-enabled: true
