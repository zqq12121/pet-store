[project]
name = "warmpaw-agent"
version = "0.1.0"
description = "暖爪 Python LangChain 宠物问答与只读业务智能体"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "langchain>=1.0,<2",
  "langchain-deepseek>=1.0,<2",
  "fastembed>=0.7,<1",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
