# 持续集成：只跑单元与集成测试，不启动 Docker 全栈。
#
# 三个技术栈各自独立作业，任一失败不影响其他作业继续跑完，
# 这样一次流水线能同时暴露 Java、前端、AI 三处的问题。
#
# 所有作业都不依赖 MySQL / Redis / Nacos：
#   - Java 测试使用 H2 内存库（见 README 与 backend/ARCHITECTURE.md）
#   - AI 测试不加载向量模型，不调用 DeepSeek
#   - 前端测试是纯函数单测（vitest）
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一轮未完成的运行，避免排队浪费额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Java 25 / Maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # -B 批处理模式（日志更易读），-ntp 关掉下载进度条。
      # 不加 -o：CI 是干净环境，必须联网下载依赖。
      - name: 构建并运行测试
        run: mvn -B -ntp -f backend/pom.xml package

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

  frontend:
    name: Node 22 / TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 必须用 npm ci：锁文件是 package-lock.json，Dockerfile 也用 npm ci。
      # 不要改成 pnpm，否则会生成第二套锁文件导致版本漂移（见 README）。
      - name: 安装依赖
        run: npm ci

      # 格式必须先过：代码曾被压成单行几千字符，Prettier 是唯一的防线。
      # 配置见 frontend/.prettierrc.json，注意 semi 必须为 true —— Vue 模板里
      # 的内联多语句处理器（@click="a=true;b=false"）在 semi:false 下会被拆行
      # 并去掉分号，导致模板表达式语法错误，vue-tsc 查不出来，只有构建才报。
      - name: 格式检查
        run: npm run format:check

      - name: 单元测试
        run: npm test
        env:
          CI: 'true'

      # build 脚本本身是 typecheck && vite build && vite build，故不再单列类型检查。
      # vue-tsc 只做类型检查、不编译模板，只有真正构建才能捕获模板表达式错误，
      # 所以这一步不能省。
      - name: 类型检查与生产构建
        run: npm run build

  ai-service:
    name: Python 3.12 / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock

      - name: 安装 Python 与依赖
        run: uv sync --frozen

      # pytest 已配置 asyncio_mode=auto 与 pythonpath=.（见 pyproject.toml）。
      - name: 运行测试
        run: uv run pytest -q

  mini-program:
    name: 小程序校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-program
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 小程序目录没有第三方依赖，scripts 全部使用 Node 内置模块与 node:test。
      - name: 页面注册与配置校验
        run: npm run check

      - name: 单元测试
        run: npm test

  # e2e 单独成 job：需要下载浏览器（约 150MB），失败原因与单测完全不同，
  # 混进 frontend job 会让"是类型错误还是浏览器缺失"难以区分。
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      # --with-deps 会一并安装 Chromium 依赖的系统库（libnss3 等），
      # 不加在 ubuntu-latest 上会因缺库启动失败。
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      # 配置里只有 chromium 与 mobile 两个项目，mobile 也已指定用 chromium，
      # 所以不需要安装 webkit/firefox。
      - name: 运行 e2e
        run: npm run e2e
        env:
          CI: 'true'

      # 失败时上传报告与截图，否则只能看到一行报错。
      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
